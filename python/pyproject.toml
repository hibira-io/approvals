[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hibira-approvals"
version = "0.1.0"
description = "Human approvals for AI agents over Hibira realtime channels: an approval inbox for LangGraph interrupts, with a FastAPI router for the React and Vue components"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Hibira", email = "support@hibira.io" }]
keywords = ["ai", "agents", "human-in-the-loop", "hitl", "approval", "langgraph", "pusher", "realtime", "hibira"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
pusher = ["pusher>=3.3"]
fastapi = ["fastapi>=0.110"]
test = ["pytest>=8", "pytest-asyncio>=0.23", "langgraph>=1.0", "fastapi>=0.110", "httpx>=0.27", "pusher>=3.3"]

[project.urls]
Homepage = "https://hibira.io"
Source = "https://github.com/hibira-io/approvals"
Issues = "https://github.com/hibira-io/approvals/issues"

[tool.hatch.build.targets.wheel]
packages = ["hibira_approvals"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
