# Publishes when a GitHub Release is published.
# - Tag v<version> (e.g. v0.1.0): npm, version from package.json. Pre-releases
#   (v0.2.0-beta.1) go to the "next" dist-tag. Needs the NPM_TOKEN secret.
# - Tag python-v<version> (e.g. python-v0.1.0): PyPI, version from
#   python/pyproject.toml, through PyPI trusted publishing (no token).
name: publish
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance, PyPI trusted publishing

concurrency:
  group: publish-${{ github.ref }}

jobs:
  npm:
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "release tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1
          fi
          case "$version" in *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT" ;; *) echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;; esac
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public --tag "${{ steps.version.outputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    if: startsWith(github.ref_name, 'python-v')
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches pyproject version
        run: |
          version="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "python-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "release tag $GITHUB_REF_NAME does not match pyproject version $version"; exit 1
          fi
      - run: pip install -e ".[test]" && pytest -q
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
